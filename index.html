/* Keep internal coordinates identical to desktop; only the complete device scales. */
(()=>{
 const DESIGN_W=430,DESIGN_H=932,root=document.documentElement;
 let lastWidth=0,stableHeight=0,raf=0;
 function fitPhone(force=false){
  const width=root.clientWidth||window.innerWidth;
  const measuredHeight=root.clientHeight||window.innerHeight;
  if(force||Math.abs(width-lastWidth)>2||measuredHeight>stableHeight)stableHeight=measuredHeight;
  lastWidth=width;
  const scale=Math.min(1,width/DESIGN_W,stableHeight/DESIGN_H);
  root.style.setProperty('--device-scale',Math.max(.1,scale).toFixed(5));
 }
 function requestFit(force=false){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>fitPhone(force))}
 fitPhone(true);
 addEventListener('orientationchange',()=>setTimeout(()=>{stableHeight=0;requestFit(true)},160),{passive:true});
 addEventListener('resize',()=>requestFit(false),{passive:true});

})();
